<!doctype html>
<html lang="zh-CN" data-root="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>返图与反馈 · Spark Light</title>
<meta name="theme-color" content="#f8f8f9">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<!-- 字体：非阻塞加载。加载不出来时，自动使用 core/base.css 里设置的兜底字体，页面不会卡住 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Serif+SC:wght@300;400;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Serif+SC:wght@300;400;600&display=swap"></noscript>
<link rel="stylesheet" href="../core/base.css">
<script src="../themes/registry.js"></script>
<script src="../core/init.js"></script>
<noscript><style>.sl-fallback{opacity:1!important;animation:none!important;pointer-events:auto!important}</style></noscript>
<link rel="stylesheet" href="page.css">
</head>
<body data-page="feedback">
<a class="sl-fallback" href="../">Spark Light 主界面</a>
<main id="main" class="sl-main fbp">
<section class="hero" id="hero" aria-labelledby="page-title">
  <div class="sky" id="sky1" aria-hidden="true"></div>
  <div class="sky" id="sky2" aria-hidden="true"></div>
  <div class="scan" aria-hidden="true"></div>
  <div class="hero-in">
    <div class="h-copy">
      <p class="h-en" aria-hidden="true">call back</p>
      <h1 class="h-title" id="page-title">返图与反馈</h1>
      <p class="h-lede" id="page-lede"></p>
    </div>
    <div class="h-more">
      <ol class="h-steps" id="steps">
        <li class="on"><em>1</em>拨入口令</li>
        <li><em>2</em>写下留言，附上返图</li>
        <li><em>3</em>审核通过后公开</li>
      </ol>
      <div class="h-act"><a class="lnk" href="#log">先看来电记录 <svg viewBox="0 0 10 16" width="10" height="16" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M5 1v14M1 11l4 4 4-4"/></svg></a></div>
    </div>

    <div class="phone" id="phone">
      <div class="ph-glow" aria-hidden="true"></div>
      <div class="ph-stage" id="phStage">
        <svg class="cord" aria-hidden="true"><path id="cordA" fill="none" stroke="#b9b4d4" stroke-width="2.6" stroke-linecap="round"/><path id="cordB" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width=".9" stroke-linecap="round" transform="translate(-.7 -.7)"/></svg>
        <svg class="ph-svg" viewBox="0 0 400 400" aria-hidden="true">
          <defs>
            <linearGradient id="bG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdfcff"/><stop offset=".4" stop-color="#e7e4f4"/><stop offset=".85" stop-color="#b6b2cf"/><stop offset="1" stop-color="#8f8bae"/></linearGradient>
            <linearGradient id="bSh" x1="0" y1="0" x2="1" y2=".7"><stop offset="0" stop-color="#cfc8ff" stop-opacity="0"/><stop offset=".3" stop-color="#cfc8ff" stop-opacity=".6"/><stop offset=".55" stop-color="#bfe6e1" stop-opacity=".5"/><stop offset=".8" stop-color="#f1d8e2" stop-opacity=".55"/><stop offset="1" stop-color="#f1d8e2" stop-opacity="0"/></linearGradient>
            <linearGradient id="bIri" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfc8ff"/><stop offset=".5" stop-color="#bfe6e1"/><stop offset="1" stop-color="#f1d8e2"/></linearGradient>
            <linearGradient id="bPl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9a5c4"/><stop offset="1" stop-color="#5f5b80"/></linearGradient>
            <radialGradient id="bRec" cx="50%" cy="42%" r="56%"><stop offset=".82" stop-color="#8f8bae" stop-opacity="0"/><stop offset=".94" stop-color="#5f5b80" stop-opacity=".45"/><stop offset="1" stop-color="#3b3858" stop-opacity=".65"/></radialGradient>
            <filter id="fBl" x="-30%" y="-200%" width="160%" height="500%"><feGaussianBlur stdDeviation="9"/></filter>
            <filter id="fBs" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.4"/></filter>
          </defs>
          <ellipse cx="200" cy="390" rx="168" ry="12" fill="#000" opacity=".65" filter="url(#fBl)"/>
          <g class="bell" fill="none" stroke="#cfc8ff" stroke-width="2" stroke-linecap="round"><path d="M22 214Q8 240 22 266M8 202Q-10 240 8 278"/><path d="M378 214Q392 240 378 266M392 202Q410 240 392 278"/></g>
          <rect class="plg" x="104" y="116" width="12" height="16" rx="3" fill="#d6d2e8" stroke="rgba(60,56,90,.35)" stroke-width=".8"/>
          <rect class="plg" x="284" y="116" width="12" height="16" rx="3" fill="#d6d2e8" stroke="rgba(60,56,90,.35)" stroke-width=".8"/>
          <path d="M88 154L94 114Q102 127 110 127Q118 127 126 114L132 154Z" fill="url(#bG)" stroke="rgba(60,56,90,.3)" stroke-width=".8"/>
          <path d="M268 154L274 114Q282 127 290 127Q298 127 306 114L312 154Z" fill="url(#bG)" stroke="rgba(60,56,90,.3)" stroke-width=".8"/>
          <rect x="40" y="360" width="320" height="26" rx="13" fill="url(#bPl)"/>
          <text x="200" y="384" text-anchor="middle" font-family="Instrument Serif,Didot,serif" font-style="italic" font-size="8.5" letter-spacing="2.5" fill="#e7e4f4" opacity=".75">Spark Light telephone</text>
          <path d="M62 374Q30 374 36 344L68 186Q76 148 114 146L286 146Q324 148 332 186L364 344Q370 374 338 374Z" fill="url(#bG)"/>
          <path d="M62 374Q30 374 36 344L68 186Q76 148 114 146L286 146Q324 148 332 186L364 344Q370 374 338 374Z" fill="url(#bSh)" opacity=".5"/>
          <path d="M62 374Q30 374 36 344L68 186Q76 148 114 146L286 146Q324 148 332 186L364 344Q370 374 338 374Z" fill="none" stroke="url(#bIri)" stroke-width="1.4"/>
          <path d="M96 170Q104 157 124 156L276 156Q296 157 304 170" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".95" filter="url(#fBs)"/>
          <path d="M70 200L48 330" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".6" filter="url(#fBs)"/>
          <path d="M330 200L352 330" stroke="#4f4b72" stroke-width="6" stroke-linecap="round" opacity=".2" filter="url(#fBs)"/>
          <circle cx="200" cy="262" r="120" fill="url(#bRec)"/>
          <path d="M90 230A118 118 0 0 1 310 230" fill="none" stroke="#3b3858" stroke-opacity=".35" stroke-width="2.4"/>
          <path d="M86 290A118 118 0 0 0 314 290" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="1.4"/>
        </svg>
        <div class="dial" id="dial" role="group" aria-label="拨盘。点数字孔拨号，或拖着数字孔顺时针转到挡片再松手">
          <svg id="dsvg" viewBox="0 0 320 320"></svg>
          <div class="sig" aria-hidden="true"><i></i><i></i><i></i></div>
        </div>
        <div class="hs-wrap" id="hsWrap" aria-hidden="true">
          <svg viewBox="0 0 360 120">
            <defs>
              <linearGradient id="hG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdfcff"/><stop offset=".55" stop-color="#dedbee"/><stop offset="1" stop-color="#a19dbd"/></linearGradient>
              <linearGradient id="hC" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f5fd"/><stop offset="1" stop-color="#aeaaca"/></linearGradient>
              <linearGradient id="hI" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfc8ff"/><stop offset=".5" stop-color="#bfe6e1"/><stop offset="1" stop-color="#f1d8e2"/></linearGradient>
            </defs>
            <path d="M58 80C92 18 268 18 302 80" fill="none" stroke="#6f6b90" stroke-opacity=".55" stroke-width="32" stroke-linecap="round" transform="translate(0 5)"/>
            <path d="M58 80C92 18 268 18 302 80" fill="none" stroke="url(#hG)" stroke-width="30" stroke-linecap="round"/>
            <path d="M58 80C92 18 268 18 302 80" fill="none" stroke="url(#hI)" stroke-width="1" stroke-opacity=".7" transform="translate(0 -14)"/>
            <path d="M102 44C140 25 220 25 258 44" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".9"/>
            <ellipse cx="58" cy="96" rx="50" ry="19" transform="rotate(-14 58 96)" fill="#8c88aa"/>
            <ellipse cx="58" cy="88" rx="50" ry="19" transform="rotate(-14 58 88)" fill="url(#hC)"/>
            <ellipse cx="58" cy="86" rx="36" ry="11" transform="rotate(-14 58 86)" fill="none" stroke="url(#hI)" stroke-width="1.1"/>
            <ellipse cx="302" cy="96" rx="50" ry="19" transform="rotate(14 302 96)" fill="#8c88aa"/>
            <ellipse cx="302" cy="88" rx="50" ry="19" transform="rotate(14 302 88)" fill="url(#hC)"/>
            <ellipse cx="302" cy="86" rx="36" ry="11" transform="rotate(14 302 86)" fill="none" stroke="url(#hI)" stroke-width="1.1"/>
          </svg>
        </div>
      </div>
      <div class="lcd" id="lcd">
        <div class="slots" id="slots" aria-hidden="true"></div>
        <input class="kb" id="kb" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="16" placeholder="在这里输入口令" aria-label="口令">
        <p class="lcd-st" id="lcdSt" role="status" aria-live="polite">请拨入口令</p>
        <p class="lcd-hint" id="lcdHint"></p>
      </div>
      <div class="tools">
        <button class="tl" id="bBack" type="button" disabled>退格</button>
        <button class="tl" id="bClear" type="button" disabled>清空</button>
        <button class="tl" id="bKb" type="button" aria-pressed="false">改用键盘输入</button>
        <button class="tl" id="bSnd" type="button" aria-pressed="false">声音 关</button>
        <button class="btn lt" id="bCall" type="button" disabled><span>接通</span></button>
      </div>
    </div>
  </div>
</section>

<section class="log" id="log" aria-labelledby="logTitle">
  <div class="log-in">
    <div class="ch-head">
      <div><p class="ch-en" aria-hidden="true">call log</p><h2 class="ch-title" id="logTitle">来电记录</h2></div>
      <p class="ch-lede">往下滚动，磁带会一条条放给你听；也可以切到卡堆，用手一张张翻。这里公开的每一条，都经过客人授权和站主审核。</p>
    </div>
  </div>
  <div class="ctrl" id="ctrl" hidden></div>
  <div class="views" id="views"><p class="sl-loading">正在读取来电记录</p></div>
</section>

<footer class="sl-foot fb-foot">Spark Light</footer>
</main>
<div class="proto" id="proto" hidden>预览模式，不会发出任何内容</div>
<script type="module" src="../core/boot.js"></script>
<script type="module" src="page.js"></script>
</body>
</html>
