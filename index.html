<!doctype html>
<html lang="zh-CN" data-root="./">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spark Light，Shadow 的个人服务站</title>
<meta name="theme-color" content="#f8f8f9">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<!-- 字体：非阻塞加载。加载不出来时，自动使用 core/base.css 里设置的兜底字体，页面不会卡住 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Serif+SC:wght@300;400;600&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Serif+SC:wght@300;400;600&display=swap"></noscript>
<link rel="stylesheet" href="./core/base.css">
<script src="./themes/registry.js"></script>
<script src="./core/init.js"></script>
<noscript><style>.sl-fallback{opacity:1!important;animation:none!important;pointer-events:auto!important}</style></noscript>
<link rel="stylesheet" href="home/page.css">
</head>
<body data-page="home">
<a class="sl-fallback" href="./">Spark Light 主界面</a>
<main id="main" class="sl-main">

  <section class="sl-hero" aria-labelledby="hero-title">
    <p class="sl-hero-owner" id="hero-owner">Shadow 的个人服务站</p>
    <h1 class="sl-hero-title" id="hero-title"><span>Spark</span> <span>Light</span></h1>
    <p class="sl-tagline" id="hero-tagline"></p>
  </section>

  <section class="sl-section" id="price" aria-labelledby="price-title">
    <h2 class="sl-h2" id="price-title">价目</h2>
    <p class="sl-lede" id="price-note"></p>
    <div id="price-root"><p class="sl-loading">正在读取价目</p></div>
  </section>

  <section class="sl-section" id="entries" aria-labelledby="entries-title">
    <h2 class="sl-h2" id="entries-title">其他页面</h2>
    <div id="entries-root"><p class="sl-loading">正在读取</p></div>
  </section>

  <footer class="sl-foot" id="foot">Spark Light</footer>
</main>
<script type="module" src="core/boot.js"></script>
<script type="module" src="home/page.js"></script>
</body>
</html>
